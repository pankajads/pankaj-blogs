title: Pankaj's notes
description: Leadership, people, and building things.
author: Pankaj
baseurl: /pankaj-blogs
url: https://pankajads.github.io
permalink: /:year/:month/:title/
future: true  # merge = publish; never hide a merged post because of its date
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true
collections:
  reddit:
    output: false
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
exclude: [AGENT.md, CLAUDE.md, README.md, stories, voice, scripts, tests, publisher, requirements.txt,
          reddit.yml, ruff.toml, pytest.ini, Gemfile, Gemfile.lock, vendor]
