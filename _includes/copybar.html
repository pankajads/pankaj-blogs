<div class="copybar{% if include.bottom %} copybar--bottom{% endif %}" data-nocopy>
  {%- if include.bottom %}<span class="copybar-note">Done reading? Take it with you.</span>{% endif %}
  <button class="btn" data-copy="rich" title="Paste into Medium, Google Docs, email — keeps headings and links">Copy article</button>
  <button class="btn" data-copy="markdown" title="For Reddit, GitHub, Markdown editors">Copy as Markdown</button>
  <button class="btn btn--ghost" data-copy="link">Copy link</button>
</div>
